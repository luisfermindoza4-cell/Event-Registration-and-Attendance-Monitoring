<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVENT REGISTRATION AND ATTENDANCE MONITORING</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .card {
            background: rgba(0, 0, 0, 0.85);
            color: white;
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        .card h1 {
            color: #00d2ff;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
        }

        .submit-btn {
            width: 100%;
            padding: 10px;
            background-color: #00d2ff;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn:hover {
            background-color: #00a8cc;
        }

        #eventAttendance {
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <main class="card">

        <h1>Student Registration</h1>

        <p>Enter your Student ID and Name</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="studentId">Student ID</label>
                <input type="text" id="studentId" required>
            </div>

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" required>
            </div>

            <button type="submit" class="submit-btn">LOGIN</button>

        </form>

        <div id="eventAttendance"></div>

    </main>

    <script src="./Student.js"></script>

</body>
</html>
